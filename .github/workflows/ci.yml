name: CI

# Fast checks on every push; the heavy end-to-end suite on pull requests, nightly,
# and on demand. The split exists because the e2e job builds the scripts image
# (~8GB: TensorFlow + a JDK), which should not sit in front of a compile error.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  # A manual run starts the whole workflow by default. `jobs` narrows it, which is
  # useful when iterating on the e2e job: its slow part is building the ~8GB scripts
  # image, and there is no reason to wait on the fast legs too.
  #   gh workflow run CI --ref <branch> -f jobs=e2e-only
  workflow_dispatch:
    inputs:
      jobs:
        description: Which jobs to run
        type: choice
        default: all
        options:
          - all
          - e2e-only
          - fast-only

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is for the dedup job's API call; everything else only
# needs to read the checkout.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Answers one question: is this a push to a branch that already has an open PR?
  # If so the `pull_request` event covers the same commit and the fast job skips.
  # Cheap (a single API call) and keeps the condition out of the matrix legs.
  # ---------------------------------------------------------------------------
  dedup:
    name: check for duplicate run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail open: if the API call fails, run the job. A missed duplicate costs
          # a few minutes; a wrongly skipped one means the commit went unchecked.
          count=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq 'length' 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "Open PR for $BRANCH; the pull_request run covers this commit."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Does every component still build? No Docker, no services, no database.
  # ---------------------------------------------------------------------------
  fast:
    name: fast (${{ matrix.component }})
    # A push to a branch that already has an open PR fires both `push` and
    # `pull_request` for the same commit, which would run these three legs twice
    # and post duplicate status checks. Skip the push-triggered copy in that case;
    # the `pull_request` one covers it. Before a PR exists, the push run is the
    # only feedback there is, so it still runs.
    needs: dedup
    # `inputs.jobs` is empty for every event but workflow_dispatch, so this only
    # narrows a manual run.
    if: >-
      needs.dedup.outputs.should-run == 'true' &&
      inputs.jobs != 'e2e-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, go]

    steps:
      - uses: actions/checkout@v4

      # -- backend ------------------------------------------------------------
      # JDK 17, not the 1.8 in <java.version>: that property sets -source/-target,
      # while jacoco 0.8.15 was pinned specifically to instrument on a 17 runtime.
      - name: Set up JDK 17
        if: matrix.component == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Gitignored, and read at static-init time by Constants -> PropertiesManager,
      # so without it the Spring context fails to load for every test.
      - name: Create specific.properties
        if: matrix.component == 'backend'
        run: cp backend/src/main/resources/specific.properties.example backend/src/main/resources/specific.properties

      # Compile, then run the offline unit tests. The stack-dependent classes are
      # tagged @Tag("integration") and excluded by surefire's <excludedGroups>
      # default, so this needs no Docker, no Mongo and no Python -- see pom.xml.
      # `install -DskipTests` first so the jar is still built even if a test fails.
      # Note: ./mvnw is committed but .mvn/wrapper/ is not, so the wrapper is
      # broken; use the runner's Maven.
      - name: Build backend
        if: matrix.component == 'backend'
        working-directory: backend
        run: mvn -B -DskipTests clean install

      - name: Test backend (offline unit tests)
        if: matrix.component == 'backend'
        working-directory: backend
        run: mvn -B test

      # Same per-case summary the e2e job prints. Exits 1 on failure.
      - name: Test summary
        if: always() && matrix.component == 'backend'
        working-directory: backend
        run: python3 test-summary.py

      # Artifact name differs from the e2e job's: two uploads sharing one name in
      # the same workflow run collide.
      - name: Upload backend unit-test reports
        if: always() && matrix.component == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

      # -- frontend -----------------------------------------------------------
      # Node 16 matches frontend/Dockerfile. react-scripts 5 hits
      # ERR_OSSL_EVP_UNSUPPORTED on Node >= 17.
      - name: Set up Node 16
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      # No package-lock.json is committed, so `npm ci` is impossible; the peer-dep
      # conflicts are why Dockerfile uses --legacy-peer-deps too.
      - name: Install frontend dependencies
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm install --legacy-peer-deps

      # Advisory. The one test is CRA's stock "renders without crashing", and it
      # already fails on a pre-existing problem unrelated to any change under
      # review: Jest cannot parse `vis-network/standalone`, whose package ships
      # ESM, because package.json sets no `transformIgnorePatterns`. Making the
      # job red on that from its first run would train everyone to ignore it.
      # Add that Jest config, then drop the `|| true` to enforce it.
      #
      # CI=true also keeps react-scripts out of watch mode, which would hang.
      - name: Test frontend (advisory)
        if: matrix.component == 'frontend'
        working-directory: frontend
        env:
          CI: true
        run: npm test || true

      - name: Build frontend
        if: matrix.component == 'frontend'
        working-directory: frontend
        env:
          CI: true
        run: npm run build

      # -- go -----------------------------------------------------------------
      # 1.21 matches the tool's Dockerfile; go.mod still declares 1.14.
      - name: Set up Go
        if: matrix.component == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: tools/functionality_refactor/src/go.sum

      # `make test` would pass vacuously (there are no _test.go files) and
      # `make lint` downloads golangci-lint v1.32.0 from master of an install
      # script -- too brittle for CI. Compiling is the real signal.
      - name: Build functionality_refactor
        if: matrix.component == 'go'
        working-directory: tools/functionality_refactor/src
        run: go build ./...

      # Advisory: `go vet` already reports 3 pre-existing unkeyed-field warnings in
      # app/database/database.go, which have nothing to do with any change under
      # review. Failing on them would make CI red from its first run, so the output
      # is surfaced without gating. Fix those, then drop the `|| true` to enforce it.
      - name: Vet functionality_refactor (advisory)
        if: matrix.component == 'go'
        working-directory: tools/functionality_refactor/src
        run: go vet ./... || true

  # ---------------------------------------------------------------------------
  # The real decomposition pipeline, against Mongo and the Python scripts service.
  # Not run on plain pushes: it builds the ~8GB scripts image, so it is reserved for
  # pull requests, the nightly schedule and manual runs.
  # ---------------------------------------------------------------------------
  e2e:
    name: end-to-end decomposition
    if: github.event_name != 'push' && inputs.jobs != 'fast-only'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The scripts service imports code2vec/controller.py at startup, which runs
      # Config(set_defaults=True, verify=True). verify() raises "Model load dir
      # `models/java-large-release` does not exist" when the directory is absent --
      # and it is gitignored, so a clean checkout has none, and the container dies
      # before serving anything.
      #
      # An empty directory is enough. The model is lazily loaded (the module sets
      # model = None and prints "Fast Load, model not initialized yet"), and the
      # backend never calls /code2vec/predict: it reads the precomputed codeVector
      # arrays straight out of the uploaded fixture JSON and vectorizes in Java.
      # Downloading the real ~1GB model would only slow the job down.
      - name: Create code2vec model directory
        run: mkdir -p scripts/models/java-large-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start mongo and scripts
        run: docker compose up -d --build mongo scripts

      # The test opens a raw socket to localhost:27017 and to Constants.SCRIPTS_ADDRESS,
      # and fails (never skips) if either is down. The scripts container imports
      # TensorFlow at boot, so it is slow to become ready -- poll instead of sleeping.
      - name: Wait for the stack
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/27017) 2>/dev/null; then
              echo "mongo is up"; break
            fi
            [ "$i" = 60 ] && { echo "mongo never came up"; exit 1; }
            sleep 2
          done

          for i in $(seq 1 90); do
            if curl -sf http://localhost:5002/docs >/dev/null; then
              echo "scripts is up"; break
            fi
            [ "$i" = 90 ] && {
              echo "scripts never came up"; docker compose logs scripts; exit 1;
            }
            sleep 2
          done

      - name: Create specific.properties
        run: cp backend/src/main/resources/specific.properties.example backend/src/main/resources/specific.properties

      # JaCoCo is already bound to the test phase in pom.xml, so no extra flags.
      # -Dexcluded.groups= (empty) clears the default <excludedGroups>integration,
      # so this runs the tagged stack tests AND the offline unit tests in one
      # invocation. Not -Dgroups=integration: that would run only the tagged ones
      # and drop the unit suite from the reports test-summary.py aggregates.
      - name: Run the test suite
        working-directory: backend
        env:
          MONGO_DB: mongodb://localhost:27017
          MONGO_DB_NAME: mono2micro
          SCRIPTS_ADDRESS: http://localhost:5002
        run: mvn -B -Dexcluded.groups= test

      # Surefire's console output names a skipped case only by index and hides the
      # reason in the XML. This prints both, so the coverage gap is visible in the
      # job log rather than buried in an artifact. Exits 1 on failure.
      - name: Test summary
        if: always()
        working-directory: backend
        run: python3 test-summary.py

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn

      # A failure inside the Python service is invisible from Maven's output.
      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color mongo scripts

      - name: Tear down
        if: always()
        run: docker compose down -v
